name: build-and-test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CLANG: clang-21
      OPT: opt-21
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev ninja-build
          clang-21 --version

      - name: Build analyzer
        run: |
          cmake -S . -B build -G Ninja -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build

      - name: Unit tests (T01 to T06)
        run: bash test/run_tests.sh

      - name: Integration check (server + /api/analyze)
        run: python3 test/integration_check.py
